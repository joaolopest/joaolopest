<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="João Lopes — Full-Stack Developer · Co-founder @ ZenixCode">
