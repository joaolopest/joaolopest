  <text x="63" y="195" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="15" fill="#FFFFFF" opacity="0.75" letter-spacing="4.5">FULL-STACK DEVELOPER  ·  CO-FOUNDER @ ZENIXCODE</text>

